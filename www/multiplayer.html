<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picas y Fijas - Multijugador</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem;
        }
        .container {
            width: 100%;
            max-width: 800px;
            padding: 1rem;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #38bdf8;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .nav-links {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .nav-links a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            margin: 0 0.8rem;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }
        input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 2px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #38bdf8; }
        input::placeholder { color: #475569; }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.8rem;
        }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-primary:hover { background: #7dd3fc; }
        .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        .btn-secondary:hover { background: #475569; }
        .error {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            text-align: center;
        }
        .hidden { display: none; }

        /* Layout de 2 jugadores */
        .game-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 600px) {
            .game-layout { grid-template-columns: 1fr; }
        }
        .player-column {
            background: #1e293b;
            border-radius: 12px;
            padding: 1rem;
            transition: box-shadow 0.3s;
        }
        .player-column.active {
            box-shadow: 0 0 0 2px #38bdf8;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }
        .player-name {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .player-name.p1 { color: #38bdf8; }
        .player-name.p2 { color: #c084fc; }
        .turn-badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
        }
        .attempt-count {
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .guess-list {
            max-height: 280px;
            overflow-y: auto;
        }
        .guess-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.6rem;
            border-radius: 8px;
            margin-bottom: 0.3rem;
            background: #0f172a;
        }
        .guess-number {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
        }
        .guess-result { display: flex; gap: 0.5rem; }
        .picas, .fijas {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
        }
        .picas { background: #854d0e; color: #fde047; }
        .fijas { background: #166534; color: #4ade80; }

        /* Input de intento */
        .guess-input-area {
            margin-bottom: 1rem;
        }
        .turn-indicator {
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            padding: 0.6rem;
            border-radius: 8px;
            background: #1e293b;
        }
        .digit-inputs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 0.5rem;
        }
        .digit-input {
            width: 3.5rem;
            height: 3.5rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            padding: 0;
        }

        /* Banner de victoria */
        .win-banner {
            text-align: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, #166534, #15803d);
            border-radius: 12px;
            margin-bottom: 1rem;
        }
        .win-banner h2 { color: #4ade80; margin-bottom: 0.5rem; }
        .win-banner p { color: #bbf7d0; }

        .vs-badge {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: #f87171;
            margin-bottom: 1rem;
        }
        .input-row {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 0.5rem;
        }
        .input-row input { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🆚 Picas y Fijas</h1>
        <p class="subtitle">Modo 2 Jugadores — Adivina el mismo número secreto</p>
        <div class="nav-links">
            <a href="index.html">🎮 1 Jugador</a>
            <a href="ranking.html">🏆 Ranking</a>
        </div>

        <!-- Pantalla de inicio -->
        <div id="start-screen">
            <div class="card">
                <div class="input-row">
                    <div style="flex:1">
                        <label for="nickname1">Jugador 1</label>
                        <input type="text" id="nickname1" placeholder="Nickname" maxlength="20" autofocus>
                    </div>
                    <div style="flex:1">
                        <label for="nickname2">Jugador 2</label>
                        <input type="text" id="nickname2" placeholder="Nickname" maxlength="20">
                    </div>
                </div>
                <div id="start-error" class="error hidden"></div>
                <button id="start-btn" class="btn-primary">Iniciar Partida</button>
            </div>
        </div>

        <!-- Pantalla de juego -->
        <div id="game-screen" class="hidden">
            <div id="win-banner" class="win-banner hidden">
                <h2 id="win-title"></h2>
                <p id="win-message"></p>
            </div>

            <div id="guess-input-area" class="guess-input-area">
                <div class="turn-indicator" id="turn-indicator"></div>
                <div class="digit-inputs">
                    <input type="text" class="digit-input" maxlength="1" inputmode="numeric" data-index="0">
                    <input type="text" class="digit-input" maxlength="1" inputmode="numeric" data-index="1">
                    <input type="text" class="digit-input" maxlength="1" inputmode="numeric" data-index="2">
                    <input type="text" class="digit-input" maxlength="1" inputmode="numeric" data-index="3">
                </div>
                <div id="guess-error" class="error hidden"></div>
                <button id="guess-btn" class="btn-primary">Adivinar</button>
            </div>

            <div class="game-layout">
                <!-- Columna Jugador 1 -->
                <div class="player-column" id="col-p1">
                    <div class="player-header">
                        <span class="player-name p1" id="p1-name"></span>
                        <span class="attempt-count" id="p1-count">0 intentos</span>
                    </div>
                    <div class="guess-list" id="p1-guesses"></div>
                </div>
                <!-- Columna Jugador 2 -->
                <div class="player-column" id="col-p2">
                    <div class="player-header">
                        <span class="player-name p2" id="p2-name"></span>
                        <span class="attempt-count" id="p2-count">0 intentos</span>
                    </div>
                    <div class="guess-list" id="p2-guesses"></div>
                </div>
            </div>

            <button id="new-game-btn" class="btn-secondary hidden" style="margin-top:1rem">Nueva partida</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        let gameId = null;
        let gameData = null;

        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        // Manejo de inputs de dígitos
        const digitInputs = $$('.digit-input');
        digitInputs.forEach((input, i) => {
            input.addEventListener('input', () => {
                input.value = input.value.replace(/[^0-9]/g, '');
                if (input.value && i < 3) digitInputs[i + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && i > 0) {
                    digitInputs[i - 1].focus();
                }
                if (e.key === 'Enter') submitGuess();
            });
        });

        function getGuessValue() {
            return Array.from(digitInputs).map(i => i.value).join('');
        }

        function clearDigits() {
            digitInputs.forEach(i => { i.value = ''; });
            digitInputs[0].focus();
        }

        function showError(id, msg) {
            const el = $(id);
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        async function apiPost(path, body) {
            const res = await fetch(`${API_BASE}${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Error del servidor');
            return data;
        }

        // Eventos
        $('#nickname2').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') startGame();
        });
        $('#start-btn').addEventListener('click', startGame);
        $('#guess-btn').addEventListener('click', submitGuess);
        $('#new-game-btn').addEventListener('click', () => {
            $('#game-screen').classList.add('hidden');
            $('#start-screen').classList.remove('hidden');
            $('#nickname1').value = '';
            $('#nickname2').value = '';
            $('#nickname1').focus();
            gameId = null;
            gameData = null;
        });

        async function startGame() {
            const nickname1 = $('#nickname1').value.trim();
            const nickname2 = $('#nickname2').value.trim();
            if (!nickname1 || !nickname2) {
                showError('#start-error', 'Ambos nicknames son requeridos.');
                return;
            }
            if (nickname1 === nickname2) {
                showError('#start-error', 'Los nicknames deben ser diferentes.');
                return;
            }

            $('#start-btn').disabled = true;
            try {
                const data = await apiPost('/multi-games', { nickname1, nickname2 });
                gameId = data.id;
                gameData = data;

                $('#p1-name').textContent = data.player1.playerNickname;
                $('#p2-name').textContent = data.player2.playerNickname;

                renderGame(data);

                $('#start-screen').classList.add('hidden');
                $('#game-screen').classList.remove('hidden');
                $('#win-banner').classList.add('hidden');
                $('#guess-input-area').classList.remove('hidden');
                $('#new-game-btn').classList.add('hidden');
                clearDigits();
            } catch (err) {
                showError('#start-error', err.message);
            } finally {
                $('#start-btn').disabled = false;
            }
        }

        async function submitGuess() {
            const guess = getGuessValue();
            if (guess.length < 4) {
                showError('#guess-error', 'Completa los 4 dígitos.');
                return;
            }

            $('#guess-btn').disabled = true;
            try {
                const data = await apiPost(`/multi-games/${gameId}/guesses`, { guess });
                gameData = data;
                renderGame(data);
                clearDigits();
            } catch (err) {
                showError('#guess-error', err.message);
            } finally {
                $('#guess-btn').disabled = false;
            }
        }

        function renderGuesses(guesses) {
            return guesses.slice().reverse().map(g => `
                <div class="guess-item">
                    <span class="guess-number">${g.guess}</span>
                    <div class="guess-result">
                        <span class="picas">P ${g.picas}</span>
                        <span class="fijas">F ${g.fijas}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderGame(data) {
            // Intentos de cada jugador
            const p1Count = data.player1.guesses.length;
            const p2Count = data.player2.guesses.length;
            $('#p1-count').textContent = `${p1Count} intento${p1Count !== 1 ? 's' : ''}`;
            $('#p2-count').textContent = `${p2Count} intento${p2Count !== 1 ? 's' : ''}`;
            $('#p1-guesses').innerHTML = renderGuesses(data.player1.guesses);
            $('#p2-guesses').innerHTML = renderGuesses(data.player2.guesses);

            // Indicador de turno
            const isP1Turn = data.currentTurnPlayerId === data.player1.playerId;
            $('#turn-indicator').innerHTML = `🎮 Turno de <strong style="color:${isP1Turn ? '#38bdf8' : '#c084fc'}">${data.currentTurnNickname}</strong>`;

            // Resaltar columna activa
            $('#col-p1').classList.toggle('active', isP1Turn);
            $('#col-p2').classList.toggle('active', !isP1Turn);

            // Victoria
            if (data.state === 'FINISHED') {
                const winnerColor = data.winnerId === data.player1.playerId ? '#38bdf8' : '#c084fc';
                const winnerGuesses = data.winnerId === data.player1.playerId ? p1Count : p2Count;
                $('#win-banner').classList.remove('hidden');
                $('#win-title').innerHTML = `🏆 ¡<span style="color:${winnerColor}">${data.winnerNickname}</span> gana!`;
                $('#win-message').textContent = `Adivinó en ${winnerGuesses} intento${winnerGuesses !== 1 ? 's' : ''}`;
                $('#guess-input-area').classList.add('hidden');
                $('#new-game-btn').classList.remove('hidden');
                $('#col-p1').classList.remove('active');
                $('#col-p2').classList.remove('active');
            }
        }
    </script>
</body>
</html>
